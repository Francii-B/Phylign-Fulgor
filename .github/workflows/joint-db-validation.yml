name: joint-db-validation

on:
  pull_request:
  push:
    branches:
      - joint-661k-ATB

jobs:
  dry-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [661k, ATB]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Snakemake and compatible PuLP
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pulp==2.7.0" "snakemake==7.32.4"

      - name: Lint workflow
        run: snakemake --lint
